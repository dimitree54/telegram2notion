[project]
name = "telegram2notion"
version = "2.0.0"
description = "Multi-user Telegram bot that saves messages and files to Notion databases"
authors = [
    {name = "telegram2notion", email = "example@example.com"}
]
dependencies = [
    "python-telegram-bot>=22.0",
    "notion-client>=2.3.0",
    "python-dotenv>=1.0.0",
    "google-cloud-storage>=3.0.0",
    "google-auth>=2.29.0",
    "aiofiles>=23.0.0",
    "pydub>=0.25.0",
]
requires-python = ">=3.9"
readme = "README_multi_user.md"

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
]

[tool.uv]
dev-dependencies = [
    "pytest>=7.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["."] 